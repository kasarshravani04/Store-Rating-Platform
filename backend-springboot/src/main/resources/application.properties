# Server Port Configuration
server.port=8080

# Spring Application Name
spring.application.name=storereview

# H2 Database Settings (Perfect for local quick runs)
spring.datasource.url=jdbc:h2:mem:reviewdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Alternate MySQL Configuration (Uncomment & input parameters for server staging)
# spring.datasource.url=jdbc:mysql://localhost:3306/reviewdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=yoursecurepassword
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA Configs
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Uncomment below line when migrating to MySQL in production
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Custom JWT Properties
security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
security.jwt.expiration-ms=86400000

# Logging Configurations
logging.level.org.springframework.security=INFO
logging.level.com.platform.storereview=DEBUG
